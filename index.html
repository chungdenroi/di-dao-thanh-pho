/* HUD chrome shared by every sim. 1rem = 10px at the 1080x1350 reference
   size; runtime sets html font-size from the viewport so it scales. */

:root {
  --bg: #09090a;
  --fg: #ece6d6;
  --dim: rgba(236, 230, 214, 0.64);
  --mute: rgba(236, 230, 214, 0.38);
  --faint: rgba(236, 230, 214, 0.16);
  --line: rgba(236, 230, 214, 0.14);
  --panel: rgba(9, 9, 10, 0.9);
  --accent: #f2b632;
  --top: 13.4rem;
  --bot: 30.5rem;
}
:root[data-theme='light'] {
  --bg: #f3f2ee;
  --fg: #151515;
  --dim: rgba(21, 21, 21, 0.66);
  --mute: rgba(21, 21, 21, 0.42);
  --faint: rgba(21, 21, 21, 0.16);
  --line: rgba(21, 21, 21, 0.16);
  --panel: rgba(243, 242, 238, 0.93);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
#app {
  position: fixed; inset: 0; color: var(--fg);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-variant-ligatures: none; -webkit-font-smoothing: antialiased;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud.hidden { display: none; }
.accent { color: var(--accent); }

/* header */
.hdr {
  position: absolute; left: 0; right: 0; top: 0; height: var(--top);
  padding: 2.4rem 2.8rem 0;
  background: linear-gradient(var(--bg) 0%, var(--bg) 78%, transparent 100%);
}
.row { display: flex; align-items: baseline; white-space: nowrap; }
.row1 { gap: 5.6rem; }
.title { display: flex; align-items: center; gap: 1.3rem; font-size: 3.6rem; font-weight: 600; letter-spacing: 0.04em; }
.title .bar { display: inline-block; width: 0.75rem; height: 3.6rem; background: var(--accent); }
.sub { font-size: 1.75rem; color: var(--dim); letter-spacing: 0.08em; }
.right { margin-left: auto; font-size: 1.6rem; color: var(--dim); letter-spacing: 0.1em; }
.row2 { margin-top: 2rem; font-size: 1.95rem; }
.row2 .stage { width: 21rem; letter-spacing: 0.05em; }
.row2 .cmd { color: var(--fg); }
.row2 .time { margin-left: auto; letter-spacing: 0.05em; }
.prog { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 1.2rem; height: 0.35rem; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* viewport overlays */
.ann { position: absolute; inset: 0; overflow: hidden; }
.ann div {
  position: absolute; transform: translate(1.4rem, -50%); white-space: nowrap;
  font-size: 1.7rem; letter-spacing: 0.04em; color: var(--fg);
  text-shadow: 0 0 0.6rem var(--bg), 0 0 1.2rem var(--bg);
}
.ann div.a { color: var(--accent); }
.ann div.box {
  padding: 0.8rem 1.1rem; border: 1px solid var(--line); background: var(--panel);
  text-shadow: none; line-height: 1.45; font-size: 1.55rem;
}
.ann div.box b { color: var(--accent); font-weight: 600; }
.wm {
  position: absolute; right: 3rem; bottom: calc(var(--bot) + 1.6rem);
  font-size: 2.3rem; letter-spacing: 0.06em; color: var(--fg); opacity: 0.3;
}

/* bottom panel */
.bot {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--bot);
  display: flex; border-top: 1px solid var(--line); background: var(--panel);
  padding: 2rem 2.8rem 1.6rem;
}
.term { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-right: 2.6rem; }
.thead { display: flex; align-items: baseline; gap: 2.4rem; font-size: 1.75rem; white-space: nowrap; }
.thead .host { font-size: 2.1rem; }
.thead .path { color: var(--dim); }
.thead .status { margin-left: auto; font-size: 1.5rem; letter-spacing: 0.1em; display: flex; align-items: center; gap: 0.9rem; }
.thead .status i { width: 1rem; height: 1rem; border-radius: 50%; background: var(--accent); display: inline-block; }
.prompt { margin-top: 1.9rem; font-size: 2.2rem; white-space: nowrap; overflow: hidden; }
.logs { margin-top: 1.1rem; font-size: 1.85rem; line-height: 1.52; flex: 1; overflow: hidden; }
.logs div { white-space: nowrap; overflow: hidden; text-overflow: clip; }
.logs .ln { color: var(--mute); display: inline-block; width: 6.4rem; }
.logs .hl { color: var(--accent); }
.caret { display: inline-block; width: 0.95em; height: 1.05em; vertical-align: -0.15em; background: var(--accent); margin-left: 0.15em; }
.tfoot { font-size: 1.35rem; color: var(--mute); white-space: nowrap; letter-spacing: 0.04em; }
.side {
  width: 31%; border-left: 1px solid var(--line); padding-left: 2.2rem;
  display: flex; flex-direction: column;
}
.shead { font-size: 1.45rem; letter-spacing: 0.12em; }
.mini { width: 100%; flex: 1; min-height: 0; display: block; margin: 0.8rem 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.4rem; font-size: 1.35rem; color: var(--mute); }
.stats b { display: block; font-size: 2rem; color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
.sfoot { margin-top: 0.8rem; font-size: 1.3rem; color: var(--mute); letter-spacing: 0.05em; }
.baseline { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 0.9rem; height: 0.25rem; background: var(--line); }
.baseline i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* director layers */
.dir-glitch { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.dir-flash {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(ellipse 75% 55% at 50% 45%, var(--accent) 0%, transparent 70%), rgba(255,255,255,0.18);
}
.dir-story {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none;
  display: flex; align-items: flex-end; justify-content: center; padding: 0 4.5rem 6rem; opacity: 0;
}
.cap { text-align: center; max-width: 96rem; position: relative; }
.cap::before {
  content: ''; position: absolute; inset: -6rem -10rem; z-index: -1;
  background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0) 100%);
}
:root[data-theme='light'] .cap::before { background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(243,242,238,0.8) 0%, rgba(243,242,238,0) 100%); }
.cap-main {
  font-family: 'Inter', 'Inter Variable', system-ui, sans-serif; font-weight: 800;
  font-size: 11.5rem; line-height: 0.98; letter-spacing: -0.035em; color: var(--fg);
  text-shadow: 0 0.4rem 2.4rem rgba(0,0,0,0.55);
}
.cap.num .cap-main { font-size: 15rem; font-variant-numeric: tabular-nums; letter-spacing: -0.045em; }
.cap-main .w { display: inline-block; transform-origin: 50% 70%; }
.cap-main .w.hl { background: var(--accent); color: #0a0a0a; padding: 0 0.14em; text-shadow: none; border-radius: 0.06em; }
.cap-sub {
  margin-top: 2rem; font-size: 2.7rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg); opacity: 0.85; min-height: 1.3em;
}
.cap-tag {
  display: inline-block; margin-bottom: 1.8rem; padding: 0.5rem 1.2rem; font-size: 2.2rem; letter-spacing: 0.12em;
  border: 1px solid var(--accent); color: var(--accent); background: rgba(0,0,0,0.5);
}

html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f2a35e; }
#app { position: fixed; inset: 0; }
#gl { display: block; width: 100%; height: 100%; }
#hud { position: absolute; inset: 0; pointer-events: none; font-family: 'Inter', system-ui, sans-serif; color: #fff7ea; }
#hud .top {
  position: absolute; top: 0; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: 14px 16px;
}
#hud .scores { display: flex; gap: 16px; font-family: 'JetBrains Mono', monospace; font-size: 14px; letter-spacing: 1px; color: #ffe9c9; text-shadow: 0 1px 4px rgba(0,0,0,.45); flex-wrap: wrap; }
#hud .scores b { color: #fff; font-size: 20px; margin-left: 4px; }
#hud .btns { display: flex; gap: 8px; pointer-events: auto; }
#hud .btns button {
  width: 40px; height: 40px; border-radius: 10px; border: 1px solid rgba(255,255,255,.35);
  background: rgba(30, 20, 12, 0.55); color: #fff7ea; font-size: 18px; cursor: pointer;
}
.panel {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  text-align: center; background: rgba(28, 18, 10, 0.85); border: 1px solid rgba(255, 200, 120, .35);
  border-radius: 18px; padding: 26px 32px; pointer-events: auto; max-width: 88vw; max-height: 86vh; overflow-y: auto;
  backdrop-filter: blur(4px);
}
.panel.hidden { display: none; }
.panel.wide { width: min(560px, 92vw); text-align: left; }
.panel h1 {
  margin: 0; font-size: 40px; letter-spacing: 5px; font-weight: 800;
  background: linear-gradient(90deg, #fff7ea, #ffb347); -webkit-background-clip: text; background-clip: text; color: transparent;
}
.panel .sub { margin: 2px 0 14px; font-family: 'JetBrains Mono', monospace; letter-spacing: 5px; color: #ffc46b; font-size: 15px; }
.panel .how { margin: 0 0 18px; color: #ffe9c9; font-size: 15px; line-height: 1.7; }
.panel .tip { margin: 14px 0 0; color: #d9c4a3; font-size: 13px; line-height: 1.6; }
.panel .final { font-size: 18px; color: #ffe9c9; }
.panel .final b { color: #f5c542; }
.panel button {
  font-family: 'JetBrains Mono', monospace; font-size: 18px; letter-spacing: 3px;
  background: #ffb347; color: #2a1a08; border: 0; border-radius: 12px;
  padding: 14px 42px; cursor: pointer; font-weight: 700;
}
.panel button:active { transform: scale(0.96); }
.jsets { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.jset h3 { margin: 8px 0 6px; font-size: 15px; color: #ffc46b; }
.jitems { display: flex; flex-wrap: wrap; gap: 6px; }
.jitem { border: 1px dashed rgba(255,255,255,.35); border-radius: 8px; padding: 4px 8px; font-size: 12px; color: #d9c4a3; }
.jitem.got { border-style: solid; color: #fff7ea; background: rgba(255,180,70,.15); }
.jlists { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 10px; }
.jlists h3 { margin: 6px 0; font-size: 14px; color: #ffc46b; }
.jlists p { margin: 3px 0; font-size: 13px; color: #ffe9c9; }
.prompt {
  position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%);
  display: flex; gap: 10px; align-items: center; pointer-events: auto;
  background: rgba(28, 18, 10, 0.85); border: 1px solid rgba(255, 200, 120, .5);
  border-radius: 12px; padding: 10px 14px; font-size: 15px; color: #fff7ea;
}
.prompt.hidden { display: none; }
.prompt button {
  font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 16px;
  background: #ffb347; color: #2a1a08; border: 0; border-radius: 8px; padding: 6px 14px; cursor: pointer;
}
#toast {
  position: absolute; left: 50%; top: 74px; transform: translateX(-50%) translateY(-8px);
  background: rgba(28, 18, 10, 0.85); border: 1px solid rgba(255, 200, 120, .5);
  color: #fff7ea; border-radius: 12px; padding: 10px 18px; font-size: 15px;
  opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; max-width: 88vw; text-align: center;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#floats { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.float-text {
  position: absolute; transform: translate(-50%, -50%);
  font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 18px; color: #ffd76b;
  text-shadow: 0 2px 6px rgba(0,0,0,.6); animation: floatUp .95s ease-out forwards; white-space: nowrap;
}
.float-text.coin { color: #ffe9a0; }
.float-text.shock { color: #fff; font-size: 26px; }
@keyframes floatUp { from { opacity: 1; margin-top: 0; } to { opacity: 0; margin-top: -46px; } }
#flash { position: absolute; inset: 0; background: rgba(255, 40, 40, 0.0); transition: background 0.4s; pointer-events: none; }
#flash.hit { background: rgba(255, 40, 40, 0.28); transition: background 0s; }
#stick {
  display: none; position: absolute; width: 120px; height: 120px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.4); background: rgba(20, 14, 8, 0.3); pointer-events: none;
}
#stickKnob {
  position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px;
  border-radius: 50%; background: rgba(255, 180, 71, 0.85); border: 2px solid rgba(255,255,255,.6);
}
#actions {
  display: none; position: absolute; right: 16px; bottom: 24px; gap: 10px; pointer-events: auto;
}
#actions button {
  width: 68px; height: 68px; border-radius: 50%; border: 2px solid rgba(255,255,255,.5);
  background: rgba(28, 18, 10, 0.6); color: #fff7ea; font-family: 'JetBrains Mono', monospace;
  font-size: 14px; font-weight: 700; cursor: pointer;
}
#actions button:active { background: rgba(255, 180, 71, 0.8); color: #2a1a08; }
@media (max-width: 600px) {
  .panel { padding: 20px 22px; }
  .panel h1 { font-size: 30px; letter-spacing: 4px; }
  .panel .how { font-size: 13px; }
  #hud .scores { font-size: 12px; gap: 10px; }
  #hud .scores b { font-size: 16px; }
  .jsets { grid-template-columns: 1fr; }
  .jlists { grid-template-columns: 1fr; }
  .prompt { bottom: 170px; }
}

#app{width:1600px!important;height:900px!important;inset:auto!important;left:0;top:0;transform-origin:0 0;background:#fff}
.vp{position:absolute;inset:0;pointer-events:none;font-family:'Inter',system-ui,sans-serif;color:#0f172a;-webkit-font-smoothing:antialiased}
.vp *{box-sizing:border-box}
.vp .haze{position:absolute;inset:0;mix-blend-mode:multiply;background:
  radial-gradient(520px 360px at 60px -40px, rgba(22,179,100,.16), rgba(22,179,100,0) 70%),
  radial-gradient(620px 420px at 1600px 20px, rgba(22,179,100,.14), rgba(22,179,100,0) 70%)}
.vp .dots{position:absolute;right:0;top:0;width:420px;height:300px;opacity:.5;mix-blend-mode:multiply;
  background-image:radial-gradient(rgba(22,179,100,.35) 1px, transparent 1.4px);background-size:9px 9px;
  -webkit-mask-image:radial-gradient(360px 240px at 100% 0%, #000, transparent 75%);mask-image:radial-gradient(360px 240px at 100% 0%, #000, transparent 75%)}
.vp .logo{position:absolute;left:46px;top:22px;display:flex;align-items:center;gap:10px;font:800 23px/1 'Inter',sans-serif;letter-spacing:-.3px}
.vp .logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#22c55e,#0e9f55);position:relative;display:block}
.vp .logo i:after{content:'';position:absolute;left:8px;top:8px;width:14px;height:14px;border:3px solid #fff;border-radius:50%;border-right-color:transparent}
.vp .lang{position:absolute;right:46px;top:20px;height:32px;padding:0 14px;border:1px solid #e2e8f0;border-radius:16px;display:flex;align-items:center;gap:8px;font:600 13px/1 'Inter',sans-serif;background:#fff}
.vp .lang b{width:8px;height:8px;border-radius:50%;background:${Un};display:block;box-shadow:0 0 0 4px rgba(22,179,100,.15)}
.vp .head{position:absolute;left:0;right:0;top:52px;text-align:center}
.vp .head .ver{font:800 22px/1 'Inter',sans-serif;letter-spacing:-.3px}
.vp .head .ver em{font-style:normal;color:${Un}}
.vp .head h1{margin:10px 0 0;font:800 36px/1.05 'Inter',sans-serif;letter-spacing:-.8px}
.vp .head .rule{width:84px;height:4px;border-radius:3px;margin:12px auto 0;background:linear-gradient(90deg,rgba(22,179,100,0),${Un} 30%,${Un} 70%,rgba(22,179,100,0))}
.vp .head .date{margin-top:9px;font:500 13px/1 'Inter',sans-serif;color:#64748b}
.vp .pills{position:absolute;left:0;right:0;top:180px;display:flex;justify-content:center;gap:10px}
.vp .pill{height:34px;padding:0 15px;border:1px solid #e2e8f0;border-radius:17px;background:#fff;display:flex;align-items:center;gap:8px;font:600 13px/1 'Inter',sans-serif;color:#334155;transition:none}
.vp .pill i{width:15px;height:15px;border-radius:50%;border:1.6px solid #94a3b8;display:block;position:relative}
.vp .pill i:after{content:'';position:absolute;left:4px;top:3px;border-left:5px solid #94a3b8;border-top:3.5px solid transparent;border-bottom:3.5px solid transparent}
.vp .pill.on{border-color:${Un};background:#effbf4;color:#0b7a43}
.vp .pill.on i{border-color:${Un}}
.vp .pill.on i:after{border-left-color:${Un}}
.vp .pill.press{transform:scale(.95)}
.vp .nav{position:absolute;left:58px;top:300px;width:190px;border-left:1.5px solid #e2e8f0;padding-left:0}
.vp .nav div{position:relative;padding:7px 0 7px 18px;font:500 15px/1.2 'Inter',sans-serif;color:#94a3b8}
.vp .nav div.on{color:#0f172a;font-weight:700}
.vp .nav div.on:before{content:'';position:absolute;left:-2px;top:7px;bottom:7px;width:3px;border-radius:2px;background:#0f172a}
.vp .nav div.sub{padding:4px 0 4px 30px;font:500 12.5px/1.2 'Inter',sans-serif;color:#64748b}
.vp .cards{position:absolute;left:1340px;top:290px;width:220px;display:flex;flex-direction:column;gap:12px}
.vp .card{background:rgba(255,255,255,.92);border:1px solid #e8edf3;border-radius:14px;padding:14px 16px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 6px 18px rgba(15,23,42,.05)}
.vp .card .k{font:600 11px/1 'Inter',sans-serif;letter-spacing:.6px;text-transform:uppercase;color:#64748b}
.vp .card .v{margin-top:8px;font:800 28px/1 'Inter',sans-serif;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.vp .card .v small{font-size:14px;font-weight:600;color:#64748b;margin-left:4px}
.vp .card svg{display:block;margin-top:8px}
.vp .bar{height:6px;border-radius:3px;background:#edf2f7;margin-top:10px;overflow:hidden}
.vp .bar b{display:block;height:100%;background:${Un};border-radius:3px}
.vp .servos{display:flex;gap:6px;align-items:flex-end;height:46px;margin-top:10px}
.vp .servos b{flex:1;background:${Un};border-radius:3px 3px 1px 1px;opacity:.9}
.vp .foot{position:absolute;left:262px;right:280px;top:852px;display:flex;align-items:center;gap:14px}
.vp .foot .st{height:28px;padding:0 12px;border-radius:14px;background:#effbf4;color:#0b7a43;font:600 12.5px/28px 'Inter',sans-serif;white-space:nowrap;display:flex;align-items:center;gap:7px}
.vp .foot .st b{width:7px;height:7px;border-radius:50%;background:${Un};display:block}
.vp .foot .track{flex:1;height:3px;border-radius:2px;background:#e2e8f0;position:relative}
.vp .foot .track b{position:absolute;left:0;top:0;bottom:0;background:${Un};border-radius:2px}
.vp .foot .tm{font:600 12.5px/1 'Inter',sans-serif;color:#64748b;font-variant-numeric:tabular-nums}
.vp svg.lines{position:absolute;left:0;top:0;width:1600px;height:900px;overflow:visible}
.vp .lab{position:absolute;padding:8px 12px;background:#fff;border:1px solid #e2e8f0;border-radius:10px;box-shadow:0 4px 14px rgba(15,23,42,.08);white-space:nowrap}
.vp .lab b{display:block;font:700 13.5px/1.15 'Inter',sans-serif;color:#0f172a}
.vp .lab span{display:block;margin-top:3px;font:500 11.5px/1.1 'Inter',sans-serif;color:#64748b}
.vp .cur{position:absolute;left:0;top:0;width:26px;height:26px}
